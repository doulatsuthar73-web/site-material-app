<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Home Interior - Site Material List</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 10px; background-color: #f4f6f9; color: #333; }
    .container { max-width: 1100px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    
    /* Sheet 2 Layout Styling */
    .top-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #222; padding-bottom: 10px; margin-bottom: 15px; }
    .company-title { font-size: 24px; font-weight: bold; color: #1a365d; margin: 0; }
    .logo-box { font-weight: bold; font-size: 18px; border: 2px dashed #007bff; padding: 5px 15px; border-radius: 4px; color: #007bff; }
    
    .site-control-bar { display: flex; flex-wrap: wrap; gap: 15px; background: #e9ecef; padding: 12px; border-radius: 6px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .control-group { display: flex; align-items: center; gap: 8px; }
    .control-group label { font-weight: bold; font-size: 14px; }
    
    select, input, button { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .btn-primary { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
    .btn-success { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    .btn-pdf { background-color: #dc3545; color: white; border: none; font-weight: bold; font-size: 15px; padding: 10px 20px; cursor: pointer; border-radius: 4px; }
    
    .section-title { background: #343a40; color: white; text-align: center; padding: 8px; font-size: 16px; font-weight: bold; margin-top: 15px; border-radius: 4px; }
    
    /* Table Styling matching Sheet 2 */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { border: 1px solid #000; padding: 6px 8px; text-align: center; vertical-align: middle; }
    th { background-color: #d9e2ec; color: #102a43; font-weight: bold; }
    tr:nth-child(even) { background-color: #f8f9fa; }
    
    .text-left { text-align: left; }
    .qty-input { width: 60px; text-align: center; font-weight: bold; padding: 4px; border: 1px solid #007bff; background: #eef6ff; }
    
    /* Footer Section */
    .footer-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 15px; border-top: 2px solid #222; }
    .whatsapp-box { font-size: 13px; font-weight: bold; background: #e6f4ea; padding: 10px 15px; border-radius: 6px; border: 1px solid #28a745; }
    
    @media print {
      .no-print { display: none !important; }
      body { background: white; margin: 0; }
      .container { box-shadow: none; border: none; padding: 0; }
    }
  </style>
</head>
<body>

<div class="container" id="printableArea">

  <!-- Header Block (As per Sheet 2) -->
  <div class="top-header">
    <div>
      <h1 class="company-title" id="displayCompany">Design Home Interior</h1>
      <small style="color: #666;">Auto-Saves Date & Time On Material Request</small>
    </div>
    <div class="logo-box">LOGO</div>
  </div>

  <!-- Active Site & Site Manager (No-Print Controls) -->
  <div class="site-control-bar no-print">
    <div class="control-group">
      <label>Select Active Site:</label>
      <select id="siteSelect" onchange="switchSite()"></select>
    </div>

    <div class="control-group">
      <input type="text" id="newSiteInput" placeholder="Enter New Site Name">
      <button class="btn-primary" onclick="addNewSite()">+ Add New Site</button>
    </div>
  </div>

  <!-- Active Site Banner -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
    <h3 style="margin: 0;">Site Name: <span id="currentSiteTitle" style="color: #007bff;">Default Site</span></h3>
    <span id="dateTimeStamp" style="font-size: 12px; color: #555;"></span>
  </div>

  <div class="section-title">ADD MATERIAL LIST (SITE REQUISITION)</div>

  <!-- Material List Table (Exact Sheet 2 Format) -->
  <table>
    <thead>
      <tr>
        <th style="width: 50px;">SR. NO</th>
        <th>MATERIAL NAME</th>
        <th>SIZE / KG / NOS / PAIR / box / mtr</th>
        <th style="width: 80px;">QTY</th>
        <th style="width: 100px;">RATE</th>
        <th style="width: 80px;">CODE</th>
        <th style="width: 70px;">PHOTOS</th>
      </tr>
    </thead>
    <tbody id="materialTableBody">
      <!-- 32 Items loaded via JavaScript -->
    </tbody>
  </table>

  <!-- Footer Block (Sheet 2 Admin Contact & Download PDF) -->
  <div class="footer-bar">
    <div class="whatsapp-box">
      <div style="color: #155724; font-size: 14px; margin-bottom: 4px;">📲 ADMIN WHATSAPP</div>
      <div>9799433172 DOULAT</div>
      <div>7620520720 NIKHIL</div>
    </div>

    <div class="no-print">
      <button class="btn-pdf" onclick="generatePDF()">📄 DOWNLOAD PDF</button>
    </div>
  </div>

</div>

<script>
  // Exact 32 Items Catalog from Sheet 2
  const masterCatalog = [
    { id: 1, name: "18mm Plywood", unit: "8*4/7*4", rate: "60/-sqft", code: "", photo: "" },
    { id: 2, name: "12mm Plywood", unit: "8*4/7*4", rate: "45/-sqft", code: "", photo: "" },
    { id: 3, name: "08mm Plywood", unit: "8*4/7*4", rate: "40/-sqft", code: "", photo: "" },
    { id: 4, name: "06mm Plywood", unit: "8*4/7*4", rate: "30/-sqft", code: "", photo: "" },
    { id: 5, name: "18mm HDHMR Sheet", unit: "8*4", rate: "60/-sqft", code: "", photo: "" },
    { id: 6, name: "12mm HDHMR Sheet", unit: "8*4", rate: "45/-sqft", code: "", photo: "" },
    { id: 7, name: "08mm HDHMR Sheet", unit: "8*4", rate: "32/-sqft", code: "", photo: "" },
    { id: 8, name: "06mm HDHMR Sheet", unit: "8*4", rate: "28/-sqft", code: "", photo: "" },
    { id: 9, name: "04mm HDHMR Sheet", unit: "8*4", rate: "25/-sqft", code: "", photo: "" },
    { id: 10, name: "0.8mmInternal Laminate White", unit: "8*4", rate: "500/-per Sheet", code: "", photo: "" },
    { id: 11, name: "0.8mmInternal Laminate Fabric", unit: "8*4", rate: "550/-per Sheet", code: "", photo: "" },
    { id: 12, name: "0.8mmInternal Laminate other", unit: "8*4", rate: "500/-per Sheet", code: "", photo: "" },
    { id: 13, name: "Fevicol", unit: "KG", rate: "220/ per kg", code: "", photo: "" },
    { id: 14, name: "Abro tape Roll", unit: "Nos", rate: "120/- nos", code: "", photo: "" },
    { id: 15, name: "Nails 19 *3/4", unit: "kg", rate: "90/-per KG", code: "", photo: "" },
    { id: 16, name: "Nails 17 *3/4", unit: "kg", rate: "90/-per KG", code: "", photo: "" },
    { id: 17, name: "Nails 17 *1", unit: "kg", rate: "90/-per KG", code: "", photo: "" },
    { id: 18, name: "Nails 17 *1.1/4", unit: "kg", rate: "90/-per KG", code: "", photo: "" },
    { id: 19, name: "Nails 14 *1.3/4", unit: "kg", rate: "90/-per KG", code: "", photo: "" },
    { id: 20, name: "Scrows 10*100 star", unit: "1 Box =100", rate: "400/- per box", code: "", photo: "" },
    { id: 21, name: "Scrows 10*75 star", unit: "1 Box =100", rate: "400/- per box", code: "", photo: "" },
    { id: 22, name: "Scrows 8*75 star", unit: "1 Box =100", rate: "400/- per box", code: "", photo: "" },
    { id: 23, name: "Scrows 8*60 star", unit: "1 Box =100", rate: "400/- per box", code: "", photo: "" },
    { id: 24, name: "Scrows 8*38 star", unit: "1 Box =100", rate: "400/- per box", code: "", photo: "" },
    { id: 25, name: "Scrows 8*32 star", unit: "1 Box =100", rate: "400/- per box", code: "", photo: "" },
    { id: 26, name: "Scrows 6*32 star", unit: "1 Box =100", rate: "400/- per box", code: "", photo: "" },
    { id: 27, name: "Scrows 6*19 star", unit: "1 Box =100", rate: "400/- per box", code: "", photo: "" },
    { id: 28, name: "Scrows 6*13 star", unit: "1 Box =100", rate: "400/- per box", code: "", photo: "" },
    { id: 29, name: "Shelf thared Scrows 6*32", unit: "1 Box =100", rate: "400/- per box", code: "", photo: "" },
    { id: 30, name: "Shelf thared Scrows 6*19", unit: "1 Box =100", rate: "400/- per box", code: "", photo: "" },
    { id: 31, name: "6mm Rawal pagal", unit: "1 Box =100", rate: "400/- per box", code: "", photo: "" },
    { id: 32, name: "Carcass Edge Banding 0.8mm", unit: "MTR", rate: "25/- Per Mtr", code: "", photo: "" }
  ];

  let appData = JSON.parse(localStorage.getItem('sheet2AppData')) || {
    sites: ['Default Site', 'Kesar Site'],
    activeSite: 'Default Site',
    quantities: {} // Stores quantities per site
  };

  function init() {
    renderSiteDropdown();
    renderTable();
    updateDateTime();
  }

  function updateDateTime() {
    const now = new Date();
    document.getElementById('dateTimeStamp').innerText = "Date: " + now.toLocaleDateString('en-GB') + " | " + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  }

  function renderSiteDropdown() {
    const select = document.getElementById('siteSelect');
    select.innerHTML = '';
    appData.sites.forEach(site => {
      const opt = document.createElement('option');
      opt.value = site;
      opt.innerText = site;
      if(site === appData.activeSite) opt.selected = true;
      select.appendChild(opt);
    });
    document.getElementById('currentSiteTitle').innerText = appData.activeSite;
  }

  function addNewSite() {
    const siteName = document.getElementById('newSiteInput').value.trim();
    if (siteName && !appData.sites.includes(siteName)) {
      appData.sites.push(siteName);
      appData.activeSite = siteName;
      saveData();
      renderSiteDropdown();
      renderTable();
      document.getElementById('newSiteInput').value = '';
    }
  }

  function switchSite() {
    appData.activeSite = document.getElementById('siteSelect').value;
    saveData();
    document.getElementById('currentSiteTitle').innerText = appData.activeSite;
    renderTable();
  }

  function saveData() {
    localStorage.setItem('sheet2AppData', JSON.stringify(appData));
  }

  function handleQtyChange(itemId, value) {
    if (!appData.quantities[appData.activeSite]) {
      appData.quantities[appData.activeSite] = {};
    }
    appData.quantities[appData.activeSite][itemId] = value;
    saveData();
  }

  function renderTable() {
    const tbody = document.getElementById('materialTableBody');
    tbody.innerHTML = '';

    const currentSiteQtys = appData.quantities[appData.activeSite] || {};

    masterCatalog.forEach((item) => {
      const qtyVal = currentSiteQtys[item.id] || '';
      
      tbody.innerHTML += `
        <tr>
          <td>${item.id}</td>
          <td class="text-left"><b>${item.name}</b></td>
          <td>${item.unit}</td>
          <td>
            <input type="number" class="qty-input" value="${qtyVal}" placeholder="0" min="0" onchange="handleQtyChange(${item.id}, this.value)">
          </td>
          <td>${item.rate}</td>
          <td>${item.code || '-'}</td>
          <td><span style="color:#007bff; cursor:pointer;">📷 Photos</span></td>
        </tr>
      `;
    });
  }

  function generatePDF() {
    const element = document.getElementById('printableArea');
    const opt = {
      margin:       0.3,
      filename:     `${appData.activeSite}_Material_List.pdf`,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2 },
      jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
    };
    
    // Temporarily hide no-print elements
    html2pdf().set(opt).from(element).save();
  }

  window.onload = init;
</script>

</body>
</html>
