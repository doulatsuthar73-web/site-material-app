<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Material Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans pb-10">

  <!-- Header -->
  <header class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold">Site Material Tracker</h1>
      <p id="siteSubtitle" class="text-xs text-blue-200">Worker View</p>
    </div>
    <div class="flex items-center space-x-3">
      <span id="adminBadge" class="hidden bg-green-500 text-white text-xs px-2.5 py-1 rounded-full font-semibold">Admin Active</span>
      <button id="authBtn" onclick="openLoginModal()" class="bg-blue-700 hover:bg-blue-800 text-xs text-white px-3 py-1.5 rounded transition">Admin Login</button>
    </div>
  </header>

  <div class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- Site Selector -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Select Construction Site (Max 6):</label>
      <select id="siteSelect" onchange="switchSite(this.value)" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none">
        <option value="1">Site 1: Main Site</option>
        <option value="2">Site 2</option>
        <option value="3">Site 3</option>
        <option value="4">Site 4</option>
        <option value="5">Site 5</option>
        <option value="6">Site 6</option>
      </select>
    </div>

    <!-- Main Content Panel -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
        <h2 class="font-bold text-gray-700">Master Material List</h2>
        <span id="statusView" class="text-xs bg-gray-200 text-gray-600 px-2.5 py-1 rounded-full font-medium">Rates Hidden (Worker View)</span>
      </div>

      <!-- Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-100 text-gray-600 uppercase text-xs">
            <tr>
              <th class="p-3">Code</th>
              <th class="p-3">Material Name</th>
              <th class="p-3 text-center">In Stock</th>
              <th class="p-3 text-center">Unit</th>
              <th class="p-3 rate-col hidden text-right">Rate (₹)</th>
              <th class="p-3 text-center">Photo Upload</th>
            </tr>
          </thead>
          <tbody id="materialTableBody" class="divide-y divide-gray-200">
            <!-- Dynamic Rows -->
          </tbody>
        </table>
      </div>

      <!-- Actions Footer -->
      <div class="p-4 bg-gray-50 border-t border-gray-200 flex flex-wrap gap-3 justify-between items-center">
        <button id="addMaterialBtn" onclick="openAddMaterialModal()" class="hidden bg-blue-600 text-white text-xs px-4 py-2 rounded-lg font-medium hover:bg-blue-700 transition">+ Add New Material</button>
        <button onclick="sendWhatsAppAlert()" class="bg-emerald-600 text-white text-xs px-4 py-2 rounded-lg font-medium hover:bg-emerald-700 transition flex items-center space-x-1 ml-auto">
          <span>Send WhatsApp Alert to Admin</span>
        </button>
      </div>
    </div>

  </div>

  <!-- Login Modal -->
  <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
      <h3 class="text-lg font-bold text-gray-800">Enter Phone Number</h3>
      <p class="text-xs text-gray-500">Admins: Nikhil (7620520720) / Doulat (9799433172)</p>
      <input type="tel" id="phoneInput" placeholder="Enter 10-digit number" class="w-full p-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      <button type="button" onclick="handleLogin()" class="w-full bg-blue-900 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-blue-800">Log In / Grant Access</button>
    </div>
  </div>

  <!-- Add Material Modal -->
  <div id="addMaterialModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4 shadow-2xl">
      <h3 class="text-lg font-bold text-gray-800">Add New Material Item</h3>
      <div class="space-y-3">
        <input type="text" id="matCode" placeholder="Item Code (e.g., M-101)" class="w-full p-2.5 border rounded-lg text-sm">
        <input type="text" id="matName" placeholder="Material Name" class="w-full p-2.5 border rounded-lg text-sm">
        <input type="number" id="matQty" placeholder="Initial Quantity" class="w-full p-2.5 border rounded-lg text-sm">
        <input type="text" id="matUnit" placeholder="Unit (e.g., Bags, Kg, Sqft)" class="w-full p-2.5 border rounded-lg text-sm">
        <input type="number" id="matRate" placeholder="Estimated Rate (₹)" class="w-full p-2.5 border rounded-lg text-sm">
      </div>
      <div class="flex space-x-3">
        <button onclick="closeAddMaterialModal()" class="w-1/2 bg-gray-200 text-gray-700 py-2 rounded-lg text-sm font-medium">Cancel</button>
        <button onclick="saveNewMaterial()" class="w-1/2 bg-blue-900 text-white py-2 rounded-lg text-sm font-medium">Save Item</button>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_NUMBERS = ["7620520720", "9799433172"];
    let isAdmin = false;
    let currentSite = "1";

    const defaultMaterials = [
      { code: "C-01", name: "Cement (UltraTech)", qty: 150, unit: "Bags", rate: 380 },
      { code: "S-02", name: "Steel (12mm)", qty: 2.5, unit: "Tons", rate: 62000 },
      { code: "B-03", name: "Red Bricks", qty: 5000, unit: "Pcs", rate: 9 },
      { code: "A-04", name: "Aggregate (20mm)", qty: 400, unit: "Cu.ft", rate: 45 }
    ];

    function getSiteData(siteId) {
      const data = localStorage.getItem('site_mat_data_' + siteId);
      return data ? JSON.parse(data) : defaultMaterials;
    }

    function saveSiteData(siteId, data) {
      localStorage.setItem('site_mat_data_' + siteId, JSON.stringify(data));
    }

    function renderTable() {
      const materials = getSiteData(currentSite);
      const tbody = document.getElementById('materialTableBody');
      tbody.innerHTML = '';

      materials.forEach((item, index) => {
        const row = document.createElement('tr');
        row.className = index % 2 === 0 ? 'bg-white' : 'bg-gray-50';
        row.innerHTML = `
          <td class="p-3 font-medium text-gray-900">${item.code}</td>
          <td class="p-3 font-semibold text-gray-800">${item.name}</td>
          <td class="p-3 text-center font-bold text-blue-700">${item.qty}</td>
          <td class="p-3 text-center text-gray-500 text-xs">${item.unit}</td>
          <td class="p-3 rate-col ${isAdmin ? '' : 'hidden'} text-right font-medium text-emerald-700">₹${item.rate}</td>
          <td class="p-3 text-center">
            <input type="file" accept="image/*" class="hidden" id="file-${index}" onchange="handlePhotoUpload(event, ${index})">
            <button onclick="document.getElementById('file-${index}').click()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs px-2.5 py-1 rounded">📷 Photo</button>
          </td>
        `;
        tbody.appendChild(row);
      });

      updateAdminUI();
    }

    function updateAdminUI() {
      const rateCols = document.querySelectorAll('.rate-col');
      rateCols.forEach(col => col.classList.toggle('hidden', !isAdmin));

      document.getElementById('addMaterialBtn').classList.toggle('hidden', !isAdmin);
      document.getElementById('adminBadge').classList.toggle('hidden', !isAdmin);
      
      const authBtn = document.getElementById('authBtn');
      const statusView = document.getElementById('statusView');
      const subtitle = document.getElementById('siteSubtitle');

      if (isAdmin) {
        authBtn.innerText = 'Log Out';
        authBtn.onclick = handleLogout;
        statusView.innerText = 'Admin View (Rates Visible)';
        statusView.className = 'text-xs bg-green-100 text-green-700 px-2.5 py-1 rounded-full font-medium';
        subtitle.innerText = 'Admin Control Active';
      } else {
        authBtn.innerText = 'Admin Login';
        authBtn.onclick = openLoginModal;
        statusView.innerText = 'Rates Hidden (Worker View)';
        statusView.className = 'text-xs bg-gray-200 text-gray-600 px-2.5 py-1 rounded-full font-medium';
        subtitle.innerText = 'Worker View';
      }
    }

    function handleLogin() {
      const input = document.getElementById('phoneInput').value.trim();
      if (ADMIN_NUMBERS.includes(input)) {
        isAdmin = true;
        closeLoginModal();
        renderTable();
      } else {
        alert('Unauthorized number! Access granted as Worker (Rates Hidden).');
        isAdmin = false;
        closeLoginModal();
        renderTable();
      }
    }

    function handleLogout() {
      isAdmin = false;
      renderTable();
    }

    function openLoginModal() {
      document.getElementById('phoneInput').value = '';
      document.getElementById('loginModal').classList.remove('hidden');
    }

    function closeLoginModal() {
      document.getElementById('loginModal').classList.add('hidden');
    }

    function switchSite(val) {
      currentSite = val;
      renderTable();
    }

    function openAddMaterialModal() {
      document.getElementById('addMaterialModal').classList.remove('hidden');
    }

    function closeAddMaterialModal() {
      document.getElementById('addMaterialModal').classList.add('hidden');
    }

    function saveNewMaterial() {
      const code = document.getElementById('matCode').value;
      const name = document.getElementById('matName').value;
      const qty = document.getElementById('matQty').value;
      const unit = document.getElementById('matUnit').value;
      const rate = document.getElementById('matRate').value;

      if (!code || !name) {
        alert('Code and Name are required!');
        return;
      }

      const list = getSiteData(currentSite);
      list.push({ code, name, qty: qty || 0, unit: unit || 'Pcs', rate: rate || 0 });
      saveSiteData(currentSite, list);

      closeAddMaterialModal();
      renderTable();
    }

    function handlePhotoUpload(event, index) {
      const file = event.target.files[0];
      if (file) {
        alert(Photo "${file.name}" attached successfully for item ${index + 1}!);
      }
    }

    function sendWhatsAppAlert() {
      const text = encodeURIComponent(Hello Admin, updates uploaded for Site ${currentSite}. Please check the portal.);
      window.open(https://wa.me/919799433172?text=${text}, '_blank');
    }

    renderTable();
  </script>
</body>
</html>
