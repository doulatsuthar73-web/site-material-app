<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Design Home Interior - Easy Worker Material List</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 10px; background-color: #f4f6f9; color: #333; }
    .container { max-width: 1000px; margin: auto; background: #fff; padding: 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    
    .header { border-bottom: 2px solid #1a365d; padding-bottom: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .company-title { font-size: 18px; font-weight: bold; color: #1a365d; margin: 0; }
    
    .site-bar { background: #eef6ff; padding: 10px; border-radius: 6px; border: 1px solid #bfe0ff; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
    .site-bar label { font-weight: bold; font-size: 13px; color: #1a365d; }
    select, input { padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; width: 100%; }
    
    /* Table Styling for Easy Input */
    .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; min-width: 700px; border-collapse: collapse; font-size: 13px; margin-top: 5px; }
    th, td { border: 1px solid #000; padding: 6px 4px; text-align: center; vertical-align: middle; }
    th { background-color: #d9e2ec; color: #102a43; font-weight: bold; }
    tr:nth-child(even) { background-color: #f8f9fa; }
    
    .text-left { text-align: left; font-size: 13px; }
    .qty-input { width: 60px; text-align: center; font-weight: bold; padding: 6px; border: 2px solid #007bff; background: #eef6ff; font-size: 15px; border-radius: 4px; }
    .size-input { width: 100px; padding: 5px; font-size: 12px; border: 1px solid #aaa; border-radius: 4px; }
    
    /* Camera & Image Input Styling */
    .cam-btn { background: #6c757d; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 14px; display: inline-block; }
    .img-preview { width: 35px; height: 35px; object-fit: cover; border-radius: 4px; border: 1px solid #007bff; }
    
    /* Bottom Summary & WhatsApp Action */
    .footer-action { margin-top: 15px; padding-top: 12px; border-top: 2px solid #1a365d; text-align: center; }
    .total-box { font-size: 18px; font-weight: bold; color: #2b6cb0; margin-bottom: 12px; text-align: right; background: #ebf8ff; padding: 10px; border-radius: 6px; }
    
    .btn-whatsapp { background-color: #25D366; color: white; border: none; font-size: 18px; font-weight: bold; padding: 14px 20px; border-radius: 8px; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 3px 6px rgba(0,0,0,0.2); }
    .btn-whatsapp:active { transform: scale(0.98); }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <div>
      <h1 class="company-title">Design Home Interior</h1>
      <small style="color: #666; font-size: 11px;">Worker Site Requisition</small>
    </div>
    <span id="dateTimeStamp" style="font-size: 11px; font-weight: bold; color: #555;"></span>
  </div>

  <div class="site-bar">
    <div>
      <label>📍 Active Site Name (साइट का नाम):</label>
      <select id="siteSelect" onchange="switchSite()"></select>
    </div>
    <div style="display: flex; gap: 5px;">
      <input type="text" id="newSiteInput" placeholder="+ Nayi Site Ka Naam">
      <button style="background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; min-width: 80px;" onclick="addNewSite()">Add</button>
    </div>
  </div>

  <div style="background: #343a40; color: white; text-align: center; padding: 8px; font-size: 14px; font-weight: bold; border-radius: 4px; margin-bottom: 8px;">
    READY MATERIAL LIST (QTY & SIZE BHAREIN)
  </div>

  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th style="width: 30px;">#</th>
          <th style="min-width: 140px;" class="text-left">MATERIAL NAME</th>
          <th style="width: 70px;">QTY</th>
          <th style="min-width: 110px;">SIZE / NOTE</th>
          <th style="min-width: 75px;">RATE</th>
          <th style="min-width: 85px;">AMOUNT</th>
          <th style="width: 75px;">PHOTO</th>
        </tr>
      </thead>
      <tbody id="materialTableBody"></tbody>
    </table>
  </div>

  <div class="footer-action">
    <div class="total-box">
      Total Estimated Amount: ₹<span id="grandTotal">0.00</span>
    </div>

    <button class="btn-whatsapp" onclick="sendToWhatsApp()">
      📲 ADMIN KO WHATSAPP PAR BHEJEIN
    </button>
  </div>

</div>

<script>
  const adminWhatsAppNumber = "919799433172"; // Admin WhatsApp Number

  const masterCatalog = [
    { id: 1, name: "18mm Plywood", defaultSize: "8*4/7*4", rate: 60, isSqft: true, sqft: 32 },
    { id: 2, name: "12mm Plywood", defaultSize: "8*4/7*4", rate: 45, isSqft: true, sqft: 28 },
    { id: 3, name: "08mm Plywood", defaultSize: "8*4/7*4", rate: 40, isSqft: true, sqft: 28 },
    { id: 4, name: "06mm Plywood", defaultSize: "8*4/7*4", rate: 30, isSqft: true, sqft: 28 },
    { id: 5, name: "18mm HDHMR Sheet", defaultSize: "8*4", rate: 60, isSqft: true, sqft: 32 },
    { id: 6, name: "12mm HDHMR Sheet", defaultSize: "8*4", rate: 45, isSqft: true, sqft: 32 },
    { id: 7, name: "08mm HDHMR Sheet", defaultSize: "8*4", rate: 32, isSqft: true, sqft: 32 },
    { id: 8, name: "06mm HDHMR Sheet", defaultSize: "8*4", rate: 28, isSqft: true, sqft: 32 },
    { id: 9, name: "04mm HDHMR Sheet", defaultSize: "8*4", rate: 25, isSqft: true, sqft: 32 },
    { id: 10, name: "0.8mm Internal Laminate White", defaultSize: "8*4 Sheet", rate: 500 },
    { id: 11, name: "0.8mm Internal Laminate Fabric", defaultSize: "8*4 Sheet", rate: 550 },
    { id: 12, name: "0.8mm Internal Laminate Other", defaultSize: "8*4 Sheet", rate: 500 },
    { id: 13, name: "Fevicol", defaultSize: "KG", rate: 220 },
    { id: 14, name: "Abro Tape Roll", defaultSize: "Nos", rate: 120 },
    { id: 15, name: "Nails 19 *3/4", defaultSize: "KG", rate: 90 },
    { id: 16, name: "Nails 17 *3/4", defaultSize: "KG", rate: 90 },
    { id: 17, name: "Nails 17 *1", defaultSize: "KG", rate: 90 },
    { id: 18, name: "Nails 17 *1.1/4", defaultSize: "KG", rate: 90 },
    { id: 19, name: "Nails 14 *1.3/4", defaultSize: "KG", rate: 90 },
    { id: 20, name: "Screws 10*100 star", defaultSize: "Box (100 Pcs)", rate: 400 },
    { id: 21, name: "Screws 10*75 star", defaultSize: "Box (100 Pcs)", rate: 400 },
    { id: 22, name: "Screws 8*75 star", defaultSize: "Box (100 Pcs)", rate: 400 },
    { id: 23, name: "Screws 8*60 star", defaultSize: "Box (100 Pcs)", rate: 400 },
    { id: 24, name: "Screws 8*38 star", defaultSize: "Box (100 Pcs)", rate: 400 },
    { id: 25, name: "Screws 8*32 star", defaultSize: "Box (100 Pcs)", rate: 400 },
    { id: 26, name: "Screws 6*32 star", defaultSize: "Box (100 Pcs)", rate: 400 },
    { id: 27, name: "Screws 6*19 star", defaultSize: "Box (100 Pcs)", rate: 400 },
    { id: 28, name: "Screws 6*13 star", defaultSize: "Box (100 Pcs)", rate: 400 },
    { id: 29, name: "Shelf thread Screws 6*32", defaultSize: "Box (100 Pcs)", rate: 400 },
    { id: 30, name: "Shelf thread Screws 6*19", defaultSize: "Box (100 Pcs)", rate: 400 },
    { id: 31, name: "6mm Rawal Plug", defaultSize: "Box (100 Pcs)", rate: 400 },
    { id: 32, name: "Carcass Edge Banding 0.8mm", defaultSize: "MTR", rate: 25 }
  ];

  let appData = JSON.parse(localStorage.getItem('designHomeWorkerData')) || {
    sites: ['Default Site', 'Kesar Site'],
    activeSite: 'Default Site',
    inputs: {} // siteWise storage
  };

  function init() {
    renderSiteDropdown();
    renderTable();
    updateDateTime();
  }

  function updateDateTime() {
    const now = new Date();
    document.getElementById('dateTimeStamp').innerText = now.toLocaleDateString('en-GB') + " " + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  }

  function renderSiteDropdown() {
    const select = document.getElementById('siteSelect');
    select.innerHTML = '';
    appData.sites.forEach(site => {
      const opt = document.createElement('option');
      opt.value = site;
      opt.innerText = site;
      if (site === appData.activeSite) opt.selected = true;
      select.appendChild(opt);
    });
  }

  function addNewSite() {
    const val = document.getElementById('newSiteInput').value.trim();
    if (val && !appData.sites.includes(val)) {
      appData.sites.push(val);
      appData.activeSite = val;
      saveData();
      renderSiteDropdown();
      renderTable();
      document.getElementById('newSiteInput').value = '';
    }
  }

  function switchSite() {
    appData.activeSite = document.getElementById('siteSelect').value;
    saveData();
    renderTable();
  }

  function saveData() {
    localStorage.setItem('designHomeWorkerData', JSON.stringify(appData));
  }

  function getSiteInputs() {
    if (!appData.inputs[appData.activeSite]) {
      appData.inputs[appData.activeSite] = {};
    }
    return appData.inputs[appData.activeSite];
  }

  function handleQtyChange(id, value) {
    const inputs = getSiteInputs();
    if (!inputs[id]) inputs[id] = {};
    inputs[id].qty = value;
    saveData();
    calculateTotals();
  }

  function handleSizeChange(id, value) {
    const inputs = getSiteInputs();
    if (!inputs[id]) inputs[id] = {};
    inputs[id].size = value;
    saveData();
  }

  function handlePhotoUpload(id, event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const inputs = getSiteInputs();
        if (!inputs[id]) inputs[id] = {};
        inputs[id].photo = e.target.result;
        saveData();
        renderTable();
      };
      reader.readAsDataURL(file);
    }
  }

  function renderTable() {
    const tbody = document.getElementById('materialTableBody');
    tbody.innerHTML = '';
    const currentInputs = getSiteInputs();

    masterCatalog.forEach((item) => {
      const itemData = currentInputs[item.id] || {};
      const qtyVal = itemData.qty || '';
      const sizeVal = itemData.size !== undefined ? itemData.size : item.defaultSize;
      const photoVal = itemData.photo || '';

      const photoHtml = photoVal 
        ? `<img src="${photoVal}" class="img-preview" onclick="triggerFileInput(${item.id})">`
        : `<button class="cam-btn" onclick="triggerFileInput(${item.id})">📷</button>`;

      tbody.innerHTML += `
        <tr>
          <td>${item.id}</td>
          <td class="text-left"><b>${item.name}</b></td>
          <td>
            <input type="number" class="qty-input" value="${qtyVal}" placeholder="0" min="0" oninput="handleQtyChange(${item.id}, this.value)">
          </td>
          <td>
            <input type="text" class="size-input" value="${sizeVal}" oninput="handleSizeChange(${item.id}, this.value)">
          </td>
          <td>₹${item.rate}</td>
          <td id="amount-${item.id}">₹0.00</td>
          <td>
            ${photoHtml}
            <input type="file" id="file-${item.id}" accept="image/*" capture="environment" style="display:none;" onchange="handlePhotoUpload(${item.id}, event)">
          </td>
        </tr>
      `;
    });

    calculateTotals();
  }

  function triggerFileInput(id) {
    document.getElementById(`file-${id}`).click();
  }

  function calculateTotals() {
    let grandTotal = 0;
    const currentInputs = getSiteInputs();

    masterCatalog.forEach((item) => {
      const itemData = currentInputs[item.id] || {};
      const qty = parseFloat(itemData.qty) || 0;
      let amount = 0;

      if (qty > 0) {
        if (item.isSqft) {
          amount = qty * item.sqft * item.rate;
        } else {
          amount = qty * item.rate;
        }
      }

      grandTotal += amount;
      const amtEl = document.getElementById(`amount-${item.id}`);
      if (amtEl) amtEl.innerText = `₹${amount.toFixed(2)}`;
    });

    document.getElementById('grandTotal').innerText = grandTotal.toFixed(2);
  }

  function sendToWhatsApp() {
    const currentInputs = getSiteInputs();
    let message = `*DESIGN HOME INTERIOR*\n`;
    message += `📍 *Site:* ${appData.activeSite}\n`;
    message += `📅 *Date:* ${document.getElementById('dateTimeStamp').innerText}\n`;
    message += `------------------------------------\n`;
    message += `*MATERIAL REQUISITION LIST:*\n\n`;

    let itemCount = 0;
    let grandTotal = 0;

    masterCatalog.forEach((item) => {
      const itemData = currentInputs[item.id] || {};
      const qty = parseFloat(itemData.qty) || 0;
      const size = itemData.size || item.defaultSize;
      const hasPhoto = itemData.photo ? "📷 [Photo Attached]" : "";

      if (qty > 0) {
        itemCount++;
        let amount = item.isSqft ? (qty * item.sqft * item.rate) : (qty * item.rate);
        grandTotal += amount;

        message += `${itemCount}. *${item.name}*\n`;
        message += `   • Qty: *${qty}* | Size/Unit: ${size}\n`;
        message += `   • Rate: ₹${item.rate} | Amt: *₹${amount.toFixed(2)}* ${hasPhoto}\n\n`;
      }
    });

    if (itemCount === 0) {
      alert("Kripya kam se kam ek material ki Quantity bharein!");
      return;
    }

    message += `------------------------------------\n`;
    message += `💰 *TOTAL AMOUNT: ₹${grandTotal.toFixed(2)}*\n`;
    message += `------------------------------------\n`;
    message += `(Worker dwara bheja gaya list)`;

    const encodedMessage = encodeURIComponent(message);
    window.open(`https://api.whatsapp.com/send?phone=${adminWhatsAppNumber}&text=${encodedMessage}`, '_blank');
  }

  window.onload = init;
</script>

</body>
</html>
